  <circle cx="44" cy="22" r="6" fill="#e8c058"/>
  <circle cx="64" cy="22" r="6" fill="#5c8f62"/>
  <rect class="tab" x="98" y="9" width="190" height="35" rx="6"/>
  <text x="116" y="31" class="caption">main.ttx</text>
  <rect class="editor" x="0" y="44" width="960" height="496"/>
  <rect class="gutter" x="0" y="44" width="64" height="496"/>

  <g class="code" xml:space="preserve">
    <text class="line" x="28" y="76">7</text>
    <text class="code" x="84" y="76"><tspan class="soft-keyword">dialect</tspan><tspan class="plain"> </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="type">Library</tspan><tspan class="punct">;</tspan></text>

