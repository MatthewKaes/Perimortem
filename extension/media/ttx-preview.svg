    <text class="code" x="112" y="216"><tspan class="modifier">const</tspan><tspan class="plain"> prefix </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="keyword">View</tspan><tspan class="punct">[</tspan><tspan class="keyword">Unsigned_8</tspan><tspan class="punct">]</tspan><tspan class="plain"> </tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="string">&quot;Echo: &quot;</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">get_view</tspan><tspan class="punct">();</tspan></text>

    <text class="line" x="20" y="244">13</text>
    <text class="code" x="112" y="244"><tspan class="modifier">const</tspan><tspan class="plain"> quit   </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="keyword">View</tspan><tspan class="punct">[</tspan><tspan class="keyword">Unsigned_8</tspan><tspan class="punct">]</tspan><tspan class="plain"> </tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="string">&quot;quit&quot;</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">get_view</tspan><tspan class="punct">();</tspan></text>

    <text class="line" x="20" y="272">14</text>
    <text class="code" x="112" y="272"><tspan class="modifier">const</tspan><tspan class="plain"> exit   </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="keyword">View</tspan><tspan class="punct">[</tspan><tspan class="keyword">Unsigned_8</tspan><tspan class="punct">]</tspan><tspan class="plain"> </tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="string">&quot;exit&quot;</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">get_view</tspan><tspan class="punct">();</tspan></text>

    <text class="line" x="20" y="300">15</text>
    <text class="code" x="112" y="300"><tspan class="keyword">while</tspan><tspan class="plain"> </tspan><tspan class="constant">true</tspan><tspan class="plain"> </tspan><tspan class="punct">{</tspan></text>

    <text class="line" x="20" y="328">16</text>
    <text class="code" x="140" y="328"><tspan class="modifier">state</tspan><tspan class="plain"> line </tspan><tspan class="accessor">:</tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="type-caller">System</tspan><tspan class="accessor">::</tspan><tspan class="type-member">Terminal</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">read_line</tspan><tspan class="punct">()</tspan><tspan class="op">?</tspan><tspan class="punct">;</tspan></text>

    <text class="line" x="20" y="356">17</text>
    <text class="code" x="140" y="356"><tspan class="modifier">state</tspan><tspan class="plain"> view </tspan><tspan class="accessor">:</tspan><tspan class="op">=</tspan><tspan class="plain"> line </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">get_view</tspan><tspan class="punct">();</tspan></text>

    <text class="line" x="20" y="384">18</text>
    <text class="code" x="140" y="384"><tspan class="keyword">if</tspan><tspan class="plain"> view </tspan><tspan class="op">==</tspan><tspan class="plain"> quit </tspan><tspan class="keyword">or</tspan><tspan class="plain"> view </tspan><tspan class="op">==</tspan><tspan class="plain"> exit </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="keyword">return</tspan><tspan class="punct">;</tspan></text>

    <text class="line" x="20" y="412">19</text>

    <text class="line" x="20" y="440">20</text>
    <text class="code" x="140" y="440"><tspan class="modifier">state</tspan><tspan class="plain"> output </tspan><tspan class="accessor">:</tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="type-caller">Dynamic</tspan><tspan class="accessor">::</tspan><tspan class="type-member">Bytes</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">copy</tspan><tspan class="punct">(</tspan><tspan class="plain">prefix</tspan><tspan class="punct">);</tspan></text>

    <text class="line" x="20" y="468">21</text>
    <text class="code" x="140" y="468"><tspan class="type-caller">System</tspan><tspan class="accessor">::</tspan><tspan class="type-member">Terminal</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">write_line</tspan><tspan class="punct">(</tspan><tspan class="plain">output </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="func">concat</tspan><tspan class="punct">(</tspan><tspan class="plain">view</tspan><tspan class="punct">))</tspan><tspan class="op">?</tspan><tspan class="punct">;</tspan></text>

