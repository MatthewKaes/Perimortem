    <text class="code" x="84" y="132"><tspan class="soft-keyword">using</tspan><tspan class="plain"> </tspan><tspan class="type">Memory</tspan><tspan class="punct">;</tspan></text>

    <text class="line" x="20" y="160">10</text>

    <text class="line" x="20" y="188">11</text>
    <text class="code" x="84" y="188"><tspan class="modifier">public</tspan><tspan class="plain"> </tspan><tspan class="func">run</tspan><tspan class="plain"> </tspan><tspan class="accessor">:</tspan><tspan class="plain"> </tspan><tspan class="soft-keyword">func</tspan><tspan class="plain"> </tspan><tspan class="op">=</tspan><tspan class="plain"> </tspan><tspan class="punct">[]</tspan><tspan class="plain"> </tspan><tspan class="accessor">-&gt;</tspan><tspan class="plain"> </tspan><tspan class="punct">[]</tspan><tspan class="plain"> </tspan><tspan class="punct">{</tspan></text>

