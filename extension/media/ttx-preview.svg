<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Tetrodotoxin TTX highlighting preview</title>
  <desc id="desc">An editor-style preview of the Echo application's highlighted TTX source.</desc>
  <style>
    .window { fill: #161312; }
    .titlebar { fill: #211817; }
    .tab { fill: #2a1d1c; }
    .editor { fill: #151211; }
    .gutter { fill: #181514; }
    .line { fill: #5e5650; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .plain { fill: #d8d8d8; }
    .modifier { fill: #ad4a52; }
    .keyword { fill: #dd6d72; }
    .constant { fill: #dd6d72; font-style: italic; }
    .soft-keyword { fill: #c7595f; }
    .type { fill: #f7a3a7; }
    .type-caller { fill: #ed868a; }
    .type-member { fill: #f7a3a7; font-style: italic; }
    .func { fill: #e2d693; }
    .string { fill: #ebd07b; }
    .op { fill: #988f82; }
    .accessor { fill: #605950; }
    .punct { fill: #4e4840; }
    .caption { fill: #8f8178; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect class="window" x="0" y="0" width="960" height="540" rx="10"/>
